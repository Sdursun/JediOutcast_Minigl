// Recommended settings for AmigaOS / PiStorm3D
// (no semicolons in comments: the console splits lines at them)
// Load with: jk2sp +exec amiga.cfg   or add "exec amiga.cfg" to autoexec.cfg

// GL extensions MiniGL supports (some menu presets turn these off)
seta r_allowExtensions "1"
seta r_ext_multitexture "1"
seta r_ext_compiled_vertex_array "1"
seta r_primitives "0"

// 640x480 was the fastest mode in the RTCW port
seta r_mode "3"
seta r_picmip "1"

// blob shadows: MiniGL has no stencil buffer
seta cg_shadows "1"

// no lightmaps: faster, flatter lighting (RTCW: about 10 fps)
seta r_vertexLight "1"
